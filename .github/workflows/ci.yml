name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev extras — no API keys, no corpus needed)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Pyflakes-level lint (blocking)
        run: ruff check src flows tools --select F,E9

      - name: Doc-lint — docs must not claim more than the code does
        run: secbrain-doc-lint

      - name: Tests
        run: pytest -q

  web:
    name: Web console · typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Ratchet, not a gate: the full rule set and strict typing are not clean yet.
  # The numbers are visible on every run; flip `continue-on-error` off once they reach zero.
  quality-ratchet:
    name: Full ruff + mypy --strict (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff (full configured rule set)
        run: ruff check . --statistics
        continue-on-error: true
      - name: mypy --strict
        run: mypy src tools
        continue-on-error: true
